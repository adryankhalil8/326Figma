<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cookie Monster Color</title>

  <link rel="stylesheet" href="./styles.css" />
  <script src="./app.js" defer></script>
</head>

<body>
  <main class="stage">
    <article class="card" aria-label="Color card">
      <div class="frame" aria-hidden="true">
        <div class="eyes">
          <div class="eye" data-eye>
            <div class="pupil" data-pupil></div>
          </div>
          <div class="eye" data-eye>
            <div class="pupil" data-pupil></div>
          </div>
        </div>
      </div>

      <section class="info">
        <h1 class="hex">#0062AD</h1>
        <p class="name">Cookie Monster</p>
        <p class="meta">Sesame Street</p>
      </section>
    </article>

    <footer class="footer">
      <a class="link" href="https://anotherplanet.io/" target="_blank" rel="noreferrer">
        https://anotherplanet.io/
      </a>
      <p class="thanks">Thank you to Rafael Serra for the original design</p>
    </footer>
  </main>
</body>
</html>
