<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frontend Mentor | Blog preview card</title>

  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png" />

  <!-- Bootstrap 5 (CDN) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />

  <!-- Your tiny overrides -->
  <link rel="stylesheet" href="blog.css" />

  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>

<body class="bg-slate-300">
  <main class="min-vh-100 d-flex align-items-center justify-content-center p-4">
    <article class="card blog-card border-0">
      <img
        src="assets/images/illustration-article.svg"
        class="card-img-top blog-img"
        alt="Blog preview illustration"
      />

      <div class="card-body p-4">
        <!-- Tag -->
        <span class="badge rounded-3 px-3 py-2 fw-bold blog-tag">Learning</span>

        <!-- Date -->
        <p class="mt-3 mb-2 small text-dark-emphasis blog-date">Published 21 Dec 2023</p>

        <!-- Title -->
        <h1 class="h5 fw-bold mb-3 blog-title">HTML &amp; CSS foundations</h1>

        <!-- Text -->
        <p class="mb-4 text-secondary blog-text">
          These languages are the backbone of every website, defining structure, content, and presentation.
        </p>

        <!-- Author -->
        <div class="d-flex align-items-center gap-2">
          <img
            src="assets/images/image-avatar.webp"
            class="rounded-circle blog-avatar"
            alt="Greg Hooper"
          />
          <span class="fw-bold blog-author">Greg Hooper</span>
        </div>
      </div>
    </article>
  </main>

  <div class="attribution pb-3">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noreferrer">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </div>
</body>
</html>
