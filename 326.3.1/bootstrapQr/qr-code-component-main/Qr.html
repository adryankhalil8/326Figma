<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frontend Mentor | QR code component</title>

  <!-- Bootstrap 5 (CDN) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />

  <!-- Small overrides only -->
  <link rel="stylesheet" href="326Qr.css" />
</head>

<body class="bg-slate-300 text-slate-900">
  <main class="min-vh-100 d-flex align-items-center justify-content-center p-4">
    <section class="card qr-card border-0 text-center" aria-label="QR code card">
      <img
        src="./images/image-qr-code.png"
        class="img-fluid qr-img"
        alt="QR code to visit Frontend Mentor"
      />

      <div class="card-body px-3 pb-4 pt-3">
        <h1 class="h5 fw-bold mb-3 qr-title">
          Improve your front-end skills by building projects
        </h1>
        <p class="mb-0 text-secondary qr-text">
          Scan the QR code to visit Frontend Mentor and take your coding skills
          to the next level
        </p>
      </div>
    </section>
  </main>
</body>
</html>
